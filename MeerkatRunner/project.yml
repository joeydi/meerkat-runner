# XcodeGen spec for the Meerkat Runner app target. Generate the project with:
#   brew install xcodegen && xcodegen
# The generated MeerkatRunner.xcodeproj is git-ignored; edit this file instead.
name: MeerkatRunner
options:
  bundleIdPrefix: us.okayplus
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Universal binary (Apple silicon + Intel).
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  RunnerKit:
    path: Packages/RunnerKit

targets:
  MeerkatRunner:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        # TODO(AGENTS.md §13 Q3): Developer ID team.
        PRODUCT_BUNDLE_IDENTIFIER: us.okayplus.meerkat-runner
        PRODUCT_NAME: Meerkat Runner
        # The product name has a space; give the module a clean name for `@testable import MeerkatRunner`.
        PRODUCT_MODULE_NAME: MeerkatRunner
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/MeerkatRunner.entitlements
        # Hardened Runtime on for every shipped build; no library-validation / JIT / dyld-env
        # exceptions (§8.1 rule 8). Debug turns it off only so `xcodebuild test` can load the test
        # bundle into the app (library validation would reject it).
        ENABLE_HARDENED_RUNTIME: YES
        # Not sandboxed: the sandbox forbids launching the user's toolchains.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: RunnerKit
        product: Models
      - package: RunnerKit
        product: Detection
      - package: RunnerKit
        product: Approval
      - package: RunnerKit
        product: Registry
      - package: RunnerKit
        product: Scanner
      - package: RunnerKit
        product: Store
      - package: RunnerKit
        product: Supervisor
      # Sparkle 2 is added in v0.3 (the only allowed third-party dependency).

  # App-level tests (AGENTS.md §10: `xcodebuild test` on every milestone). Hosted by the app.
  MeerkatRunnerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: MeerkatRunner
      - package: RunnerKit
        product: Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.okayplus.meerkat-runner.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Meerkat Runner.app/Contents/MacOS/Meerkat Runner"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  MeerkatRunner:
    build:
      targets:
        MeerkatRunner: all
        MeerkatRunnerTests: [test]
    test:
      config: Debug
      targets:
        - MeerkatRunnerTests
    run:
      config: Debug
    archive:
      config: Release
